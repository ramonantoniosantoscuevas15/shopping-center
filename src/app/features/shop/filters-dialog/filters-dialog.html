<div>
  <h3 class="text-3xl text-center pt-6 mb-3">Filtros</h3>
  <mat-divider/>
  <div class="w-1/2">
    <h4 class="font-semibold text-xl text-primary">Marcas</h4>
    <mat-selection-list>
      @for (brand of shopServices.bradsResource.value(); track brand) {
        <mat-list-option [value]="brand">{{brand}}</mat-list-option>
      }
    </mat-selection-list>

  </div>
  <div class="w-1/2">
    <h4 class="font-semibold text-xl text-primary">Tipos</h4>
    <mat-selection-list>
      @for (type of shopServices.typesResource.value(); track type) {
        <mat-list-option [value]="type">{{type}}</mat-list-option>
      }
    </mat-selection-list>

  </div>
  <div class="flex justify-end mr-6">
    <button mat-flat-button>Aplicar Filtros</button>
  </div>
</div>
